# One conf per project. Copy to $AGENT_OVERLAY_DIR/claude-routines/<name>.conf (routine-new does it for you).
# It holds the routine keys (read by claude-routine, routine-verdict, routine-policy) and the tracker keys (read by routines/bin/tracker).
# Job steps: /home/claude-agent/agent-jobs/<name>.md on the VPS (from routine-job-template.md).
PROFILE=alt,alt2,main            # first account with usage left runs it
REPO=widgets-api                 # ~claude-agent/work/<REPO>
BASE=main                        # lead worktree ~/work/wt/<name> is cut from origin/<BASE> (empty = origin/HEAD)
SCHEDULE="03:04 15:00"           # HH:MM times, one timer slot each; a slot that fires while the lead is still working is skipped
SCHEDULE_TZ=UTC                  # zone of those times (default UTC). A systemd calendar string in SCHEDULE ("*-*-* 02:00:00 UTC") stays one OnCalendar line
ARGS=(--model opus --effort medium)
# Code-only verdict after the run (routine-verdict@<VERDICT>.timer).
VERDICT=widgets                  # group name; empty or unset = no verdict for this routine
VERDICT_AT=21:00:00              # UTC, daily
VERDICT_REPOS=("api|acme/widgets-api|beta")   # tag|owner/repo|bases

# Tracker: the CSV that says who works on what (routines/bin/tracker).
TRACKER_REPO=acme/widgets-api-tracker   # required: private repo holding the CSV, unprotected (the tool writes it with the contents API)
TRACKER_PATH=backlog.csv                # required: path of the CSV inside it
CODE_REPO=acme/widgets-api              # required: where task branches and PRs live
WORK_BASE=beta                          # required: task branches are cut from this branch
#TRACKER_BRANCH=main                    # optional: branch of the tracker repo (default main; routine-new writes the repo's default)
#BRANCH_FMT='feat/t{num}-{slug}'       # optional: task branch name (this is the default)
#ID_COL='Task ID'  ID_RE='T-\d+'        # optional: id column and the shape of a valid id (defaults)
#TITLE_COL=Title  STATUS_COL=Status  DEPS_COL='Depends on'
#ORDER_COLS='Milestone,Task ID'         # optional: pick order for `tracker next`
#ROW_FILTER=                            # optional: only rows that match are tasks
#BLOCK_COL=  BLOCK_RE=                  # optional: rows whose cell matches are skipped
#LEASE_HOURS=6                          # optional: a claim with no heartbeat for this long is stale
#NOTIFY_CMD=                            # optional: command run on a block / stale claim

# Guard rules (routine-policy -> routine-policy.json, read by token-guard.py).
GUARD_REPOS=('acme/widgets-api|bases=beta|branch=^feat/t(\d+)-')
# A repo whose PRs need a local CI status and a task line:
#   'acme/task-api|bases=chore/integration|status=local-ci|runner=ci-run|task=T-NNN|format=task-contract.md step 7|branch=^feat/t(\d+)-|builder=Task API, task T-?(\d+)\b'
