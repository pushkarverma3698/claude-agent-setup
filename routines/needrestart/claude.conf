# Installed to /etc/needrestart/conf.d/claude.conf by setup-claude-routines. needrestart must never restart the
# Claude units: a restart kills every live session and tool call in them. 2026-11-06 06:05 an unattended libpcre2
# upgrade restarted claude-bgd@* and claude-remote@main:work and killed a live bh-morning build (exit 137). The units
# pick up new libraries at the next planned restart (claude-remote-update, or a reboot).
$nrconf{override_rc}{qr(^claude-)} = 0;
$nrconf{override_rc}{qr(^playwright-mcp)} = 0;
